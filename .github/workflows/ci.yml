name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Reject private ledger.write gen
        run: |
          if [ -d src/polyester/gen/ledger/write ] || grep -Rql 'ledger\.write\.v1' src/polyester/gen; then
            echo "private ledger.write.v1 must not appear in public SDK gen/" >&2
            exit 1
          fi

      - name: Refresh SDK capability artifacts
        if: matrix.python-version == '3.12'
        run: python scripts/check_sdk_coverage.py --write-capabilities

      - name: Commit capability artifacts if changed
        if: >
          matrix.python-version == '3.12' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk-capabilities.json README.md
          if git diff --staged --quiet; then
            echo "capability artifacts unchanged"
            exit 0
          fi
          git commit -m "chore: refresh sdk-capabilities and README table"
          git push

      - name: SDK Connect coverage
        run: python scripts/check_sdk_coverage.py

      - name: Refresh internal coverage scoreboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FABRIC_CONTEXT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "FABRIC_CONTEXT_DISPATCH_TOKEN unset; skipping scoreboard dispatch"
            exit 0
          fi
          gh api repos/Fabric-Labs/fabric-context/dispatches \
            -f event_type=sdk-coverage-refresh \
            -f 'client_payload[sdk]=python' \
            -f 'client_payload[sha]=${{ github.sha }}'

      - name: Ruff
        run: ruff check src tests scripts

      - name: Compile generated modules
        run: python -m compileall src/polyester

      - name: Pytest
        run: pytest tests/unit -q --cov=polyester --cov-report=term-missing

      - name: Build wheel
        run: python -m build

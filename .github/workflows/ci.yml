name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # publish.yml runs this workflow before building a release.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -c "import polyester"

      - name: Reject proto-relative Connect imports
        run: python scripts/check_connect_imports.py

      - name: Reject private ledger.write gen
        run: |
          if [ -d src/polyester/gen/ledger/write ] || grep -Rql 'ledger\.write\.v1' src/polyester/gen; then
            echo "private ledger.write.v1 must not appear in public SDK gen/" >&2
            exit 1
          fi

      - name: Public disclosure (README / CHANGELOG)
        run: python scripts/check_public_disclosure.py

      # CI never commits. Regenerate the capability artifacts and fail if the
      # committed copies are stale; run the same command locally and commit.
      - name: Capability artifacts up to date
        run: |
          python scripts/check_sdk_coverage.py --write-capabilities
          if ! git diff --exit-code -- sdk-capabilities.json README.md; then
            echo "sdk-capabilities.json or the README capability table is stale." >&2
            echo "Run: python scripts/check_sdk_coverage.py --write-capabilities" >&2
            exit 1
          fi

      - name: SDK Connect coverage
        run: python scripts/check_sdk_coverage.py

      - name: Refresh public capability matrix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FABRIC_APPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "FABRIC_APPS_DISPATCH_TOKEN unset; skipping capability matrix dispatch"
            exit 0
          fi
          gh api repos/Fabric-Labs/fabric-apps/dispatches \
            -f event_type=sdk-coverage-refresh \
            -f 'client_payload[sdk]=python' \
            -f 'client_payload[sha]=${{ github.sha }}'

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src

      - name: Compile generated modules
        run: python -m compileall src/polyester

      # Required PR gate: focused tests plus deterministic public-API local
      # HTTP/WS integration tests. Live staging tests run separately.
      - name: Pytest unit and local L2
        run: pytest tests/unit tests/hardening -q --cov=polyester --cov-report=term-missing

      - name: Build wheel
        run: python -m build

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,realtime]"

      - name: Reject private ledger.write gen
        run: |
          if [ -d src/polyester/gen/ledger/write ] || grep -Rql 'ledger\.write\.v1' src/polyester/gen; then
            echo "private ledger.write.v1 must not appear in public SDK gen/" >&2
            exit 1
          fi

      - name: SDK Connect coverage
        run: python scripts/check_sdk_coverage.py

      - name: Ruff
        run: ruff check src tests scripts

      - name: Compile generated modules
        run: python -m compileall src/polyester

      - name: Pytest
        run: pytest tests/unit -q --cov=polyester --cov-report=term-missing

      - name: Build wheel
        run: python -m build

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "polyester-sdk"
version = "0.1.0a26"
description = "Official Python SDK for Polyester APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Fabric Blockchain Labs Inc." }]
keywords = ["polyester", "trading", "sdk", "connectrpc", "protobuf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "base58>=2.1.1",
  "connectrpc>=0.9.0,<0.11",
  "cryptography>=42",
  "eth-abi>=5.1",
  "eth-account>=0.13",
  "eth-hash[pycryptodome]>=0.7",
  "eth-utils>=5.0",
  "httpx>=0.27",
  "msgspec>=0.18",
  "protobuf>=7.35.0",
  "websockets>=15",
]

[project.optional-dependencies]
# Empty stubs: realtime + chain are always installed. Kept so existing
# `pip install polyester-sdk[realtime]` / `[chain]` / `[dev,realtime]` still work.
realtime = []
chain = []
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-httpserver>=1.1",
  "python-dotenv>=1.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "build>=1.2",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/Fabric-Labs/polyester-sdk-python"
Documentation = "https://polyester.ai/docs"
Repository = "https://github.com/Fabric-Labs/polyester-sdk-python"
Issues = "https://github.com/Fabric-Labs/polyester-sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/polyester"]

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/examples",
  "/pyproject.toml",
  "/src",
]
exclude = [
  "/.coverage",
  "/.coverage.*",
  "/.env",
  "/docs",
  "/scripts",
  "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/polyester/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = ["-ra", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:SelectableGroups dict interface is deprecated\\. Use select\\.:DeprecationWarning:opentelemetry\\.util\\._importlib_metadata",
]
markers = [
  "integration: live devnet (requires POLYESTER_* env)",
  "mutation: writes state on devnet",
  "funded: balance-changing devnet tests",
  "treasury: withdraw/guard ops",
  "realtime: Centrifugo subscriptions",
  "optional: may skip when route unavailable",
  "jwt_session: JWT/session or app-user route; not part of API-key SDK acceptance",
  "smoke: shallow live RPC check (shape only; empty results OK)",
  "credentialed: live tests that require API-key credentials",
  "public_smoke: public/read-only smoke selection (no mutation/funded)",
]

[tool.mypy]
python_version = "3.11"
exclude = ["^src/polyester/gen/"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/polyester"]
omit = ["src/polyester/gen/*"]

[tool.coverage.report]
fail_under = 40
show_missing = true
